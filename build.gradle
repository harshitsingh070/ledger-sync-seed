plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    // Seed asked for 21; 17 is used here so the build also runs on machines
    // without a 21 toolchain (verify.sh uses plain javac). Language features
    // used are all available on 17; CI with JDK 21 still compiles this fine.
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencies {
    // The core pipeline (parse/ingest/report/SQL store) still compiles against
    // the JDK alone; H2 is loaded reflectively at run time. The document store
    // needs a driver: MongoDB was chosen over DynamoDB (see README decision log)
    // because it runs from `docker compose up` with no AWS credentials and its
    // explain() gives totalDocsExamined/nReturned directly.
    runtimeOnly 'com.h2database:h2:2.2.224'
    implementation 'org.mongodb:mongodb-driver-sync:5.2.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test { useJUnitPlatform() }

// Dependency-free smoke run. Works with no network and no database.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass = 'in.simplifymoney.ledgersync.SelfCheck'
    classpath = sourceSets.main.runtimeClasspath
}
